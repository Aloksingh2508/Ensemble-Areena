import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.0/build/stlite.js";
const config = {"entrypoint": "app/main.py", "requirements": ["numpy", "pandas", "scikit-learn", "matplotlib", "plotly"], "files": {".streamlit/config.toml": "[theme]\nbase = \"dark\"\nprimaryColor = \"#7C5CFF\"\nbackgroundColor = \"#0B1026\"\nsecondaryBackgroundColor = \"#131B3D\"\ntextColor = \"#E8ECFF\"\n\n[server]\nheadless = true\n", "app/__init__.py": "", "app/game/__init__.py": "\"\"\"Game engine: progress state, XP, achievements and static content.\"\"\"\n", "app/game/content.py": "\"\"\"Static game content: missions, achievements, quiz bank and theory topics.\"\"\"\nfrom src import content as C\n\nXP_GOAL = 1000\nQUIZ_LENGTH = 5\nTITLES = {1: \"ML Rookie\", 2: \"ML Apprentice\", 3: \"ML Learner\", 4: \"ML Strategist\", 5: \"ML Expert\", 6: \"ML Ninja\"}\n\nMISSIONS = [\n    dict(id=1, title=\"Prediction Rookie\", sub=\"Accuracy & Basics\", reward=100, icon=\"🎮\"),\n    dict(id=2, title=\"Random Forest Squad\", sub=\"Bagging & Variance\", reward=150, icon=\"🌲\"),\n    dict(id=3, title=\"Boosting Challenge\", sub=\"Focus on Mistakes\", reward=200, icon=\"🚀\"),\n    dict(id=4, title=\"Voting Arena\", sub=\"Hard & Soft Voting\", reward=200, icon=\"🗳️\"),\n    dict(id=5, title=\"Stacking Mastership\", sub=\"Meta Learner\", reward=250, icon=\"🧠\"),\n    dict(id=6, title=\"Final Championship\", sub=\"Pick the Winner\", reward=300, icon=\"🏆\"),\n]\n\nACHIEVEMENTS = [\n    dict(id=\"first_step\", title=\"First Step\", desc=\"Complete Level 1\", xp=100, icon=\"👣\"),\n    dict(id=\"forest_explorer\", title=\"Forest Explorer\", desc=\"Complete Level 2 (Random Forest Squad)\", xp=200, icon=\"🌲\"),\n    dict(id=\"boost_hero\", title=\"Boost Hero\", desc=\"Complete Level 3 (Boosting Challenge)\", xp=200, icon=\"🚀\"),\n    dict(id=\"voting_veteran\", title=\"Voting Veteran\", desc=\"Complete Level 4 (Voting Arena)\", xp=200, icon=\"🗳️\"),\n    dict(id=\"stack_master\", title=\"Stack Master\", desc=\"Complete Level 5 (Stacking Mastership)\", xp=250, icon=\"🧠\"),\n    dict(id=\"champion\", title=\"Champion\", desc=\"Win the Final Championship\", xp=300, icon=\"🏆\"),\n    dict(id=\"quiz_master\", title=\"Quiz Master\", desc=\"Score 4/5 or better in a quiz\", xp=150, icon=\"🎓\"),\n    dict(id=\"perfect_score\", title=\"Perfect Score\", desc=\"Score 5/5 in a quiz\", xp=200, icon=\"💯\"),\n    dict(id=\"streak_starter\", title=\"Streak Starter\", desc=\"Get 3 correct answers in a row\", xp=100, icon=\"🔥\"),\n    dict(id=\"hot_streak\", title=\"On Fire\", desc=\"Get 5 correct answers in a row\", xp=150, icon=\"⚡\"),\n    dict(id=\"theory_reader\", title=\"Bookworm\", desc=\"Read 6 topics in the Theory Library\", xp=100, icon=\"📚\"),\n    dict(id=\"experimenter\", title=\"Experimenter\", desc=\"Train models 5 times\", xp=100, icon=\"🧪\"),\n]\n\n# Demo players for the (local) leaderboard\nDEMO_PLAYERS = [(\"Priya\", 1250, 6), (\"Rahul\", 980, 5), (\"Neha\", 360, 3), (\"Aman\", 280, 2)]\n\n# id, question, options, correct index, explanation\nQUIZ = [\n    (1, \"Three classifiers predict Class A, Class A, and Class B. What is the Hard Voting prediction?\",\n     [\"Class A\", \"Class B\", \"Both A and B\", \"Depends on probabilities\"], 0,\n     \"In Hard Voting, the class with the majority of votes wins. Here, Class A gets 2 votes, so the final prediction is Class A.\"),\n    (2, \"What does Soft Voting average?\", [\"Class labels\", \"Predicted probabilities\", \"Input features\", \"Training times\"], 1,\n     \"Soft voting averages each model's predicted class probabilities and picks the class with the highest average.\"),\n    (3, \"Bagging mainly reduces…\", [\"Bias\", \"Variance\", \"The number of features\", \"The size of the data\"], 1,\n     \"Averaging many models trained on different bootstrap samples smooths out their individual noise (variance).\"),\n    (4, \"How are the models trained in boosting?\", [\"In parallel on bootstrap samples\", \"Independently on different features\",\n     \"Sequentially, each focusing on the previous errors\", \"Only on the test set\"], 2,\n     \"Boosting adds models one after another; each new model concentrates on what earlier models got wrong.\"),\n    (5, \"A bootstrap sample is drawn…\", [\"Without replacement\", \"From the test set only\", \"Sorted by label\", \"With replacement\"], 3,\n     \"Rows are drawn with replacement, so some rows repeat and ~36.8% are left out (out-of-bag).\"),\n    (6, \"Out-of-bag (OOB) samples are…\", [\"Rows a particular tree did not train on\", \"Rows with missing values\", \"Outliers removed from the data\",\n     \"The test set\"], 0, \"Each tree misses about 36.8% of rows. Predicting them with the trees that never saw them gives a free validation score.\"),\n    (7, \"What extra randomness does Random Forest add to bagging?\", [\"Random labels\", \"A random subset of features at each split\",\n     \"Random learning rates\", \"Random test sets\"], 1, \"Feature subsampling makes the trees less alike, so averaging them removes more variance.\"),\n    (8, \"Training accuracy 100% but test accuracy 80% suggests…\", [\"Underfitting\", \"Perfect generalisation\", \"Data leakage in the test set\",\n     \"Overfitting\"], 3, \"A big gap between training and test performance means the model memorised noise.\"),\n    (9, \"A depth-1 tree (stump) on curved data has…\", [\"High variance\", \"High bias\", \"Zero error\", \"No bias and no variance\"], 1,\n     \"A model that is too simple misses the pattern (high bias). Boosting stacks many stumps to fix this.\"),\n    (10, \"AdaBoost increases the weight of…\", [\"Correctly classified samples\", \"Misclassified samples\", \"Random samples\", \"Test samples\"], 1,\n     \"Misclassified samples get larger weights so the next weak learner focuses on them.\"),\n    (11, \"Gradient Boosting fits each new tree to…\", [\"The original labels\", \"Random noise\", \"The errors (gradient of the loss) of the current ensemble\",\n     \"The test set\"], 2, \"Each new tree corrects what the current ensemble still gets wrong, scaled by the learning rate.\"),\n    (12, \"A smaller learning rate in boosting usually needs…\", [\"Fewer estimators\", \"More estimators\", \"No estimators\", \"A bigger dataset\"], 1,\n     \"Smaller steps are safer but you need more of them - the learning-rate / n_estimators trade-off.\"),\n    (13, \"Why does stacking use out-of-fold predictions?\", [\"To make training faster\", \"To avoid leakage - base models predict rows they have not seen\",\n     \"To increase the number of features\", \"To remove outliers\"], 1,\n     \"If base models predicted rows they trained on, their outputs would look too good and the meta-model would over-trust them.\"),\n    (14, \"What does the meta-model in stacking learn?\", [\"Which features to drop\", \"How to combine the base models' predictions\",\n     \"The best random seed\", \"How to scale the data\"], 1, \"Unlike voting's fixed rule, the meta-model learns how much to trust each base model.\"),\n    (15, \"Is an ensemble guaranteed to beat a single model?\", [\"Yes, always\", \"Yes, if it has 100+ models\", \"No - it often helps but not always\", \"Only for neural networks\"], 2,\n     \"On small, easy or very noisy data the gain can be tiny or negative. Always compare on the same split.\"),\n    (16, \"Where should a feature scaler be fitted?\", [\"On the full dataset\", \"On the test set\", \"On the training data only\", \"After predicting\"], 2,\n     \"Fitting on test data leaks information. Put the scaler inside a Pipeline so it only sees training data.\"),\n    (17, \"Recall answers which question?\", [\"Of everything predicted positive, how much was right?\", \"Of all real positives, how many did we find?\",\n     \"How fast is the model?\", \"How many features were used?\"], 1, \"Recall = true positives / (true positives + false negatives).\"),\n    (18, \"Ensembles work best when their members are…\", [\"Identical\", \"Diverse (make different mistakes)\", \"Very small\", \"Trained on the test set\"], 1,\n     \"If all models make the same mistake, combining them changes nothing. Diversity is the key ingredient.\"),\n]\n\n_RF_MD = \"\"\"\nA **Random Forest** is bagging of decision trees **plus** a random subset of features at every split.\nEach tree votes and the majority wins. More trees → more stable predictions (accuracy plateaus rather than overfitting).\n\"\"\"\n_ADA_MD = \"\"\"\n**AdaBoost** trains weak learners (often depth-1 stumps) one after another. After each round it **raises the weights of the samples\nthat were misclassified**, so the next learner concentrates on them. Learners with lower error get a bigger say in the final weighted vote.\n\"\"\"\n_GB_MD = \"\"\"\n**Gradient Boosting** builds trees sequentially; each new tree is fitted to the **errors (gradient of the loss)** of the current ensemble and\nadded with a small step - the **learning rate**. It is flexible (many loss functions) and is the basis of XGBoost and LightGBM.\n`HistGradientBoosting` is a fast version that bins features into histograms.\n\"\"\"\n_CON = dict(C.CONCEPTS)\n\n# topic -> (markdown, optional graphviz diagram)\nTHEORY = {\n    \"Ensemble Learning\": (C.INTRO_MD + \"\\n**Real-world examples:** fraud detection, medical diagnosis, recommendation systems.\", C.DOT_SINGLE_VS_ENSEMBLE),\n    \"Bias and Variance\": (_CON[\"Bias vs. variance\"], None),\n    \"Overfitting & Underfitting\": (_CON[\"Overfitting and underfitting\"], None),\n    \"Bagging\": (C.BAGGING_MD, C.DOT_BAGGING),\n    \"Random Forest\": (_RF_MD + \"\\n\" + _CON[\"Random Forest vs. Decision Tree\"], None),\n    \"Boosting\": (C.BOOSTING_MD + \"\\n\" + _CON[\"Bagging vs. boosting\"], C.DOT_BOOSTING),\n    \"AdaBoost\": (_ADA_MD, None),\n    \"Gradient Boosting\": (_GB_MD + \"\\n\" + _CON[\"AdaBoost vs. Gradient Boosting\"], None),\n    \"Hard and Soft Voting\": (C.VOTING_MD + \"\\n\" + _CON[\"Majority voting\"], C.DOT_VOTING),\n    \"Stacking\": (C.STACKING_MD + \"\\n\" + _CON[\"Stacking vs. voting\"], C.DOT_STACKING),\n    \"Bootstrap Sampling\": (_CON[\"Bootstrap sampling\"], None),\n    \"Out-of-Bag Evaluation\": (_CON[\"Out-of-bag (OOB) evaluation\"], None),\n    \"Feature Importance\": (_CON[\"Feature importance and its limitations\"], None),\n    \"Interview Q&A\": (\"\", None),\n}\n", "app/game/state.py": "\"\"\"Player progress: XP, levels, streaks, achievements (kept in st.session_state).\"\"\"\nfrom __future__ import annotations\n\nimport copy\nimport html\nimport json\n\nimport streamlit as st\n\nfrom .content import ACHIEVEMENTS, MISSIONS, QUIZ_LENGTH, TITLES, XP_GOAL\n\nDEFAULTS = {\n    \"player\": \"Player\", \"xp\": 0, \"completed\": [], \"streak\": 0, \"best_streak\": 0, \"achievements\": [],\n    \"read_topics\": [], \"solved\": [], \"quiz_best\": 0, \"trained\": 0, \"checks\": [], \"flags\": {}, \"voting_correct\": 0,\n}\n_LISTS = (\"completed\", \"achievements\", \"read_topics\", \"solved\", \"checks\")\n\nCONDITIONS = {\n    \"first_step\": lambda s: 1 in s[\"completed\"],\n    \"forest_explorer\": lambda s: 2 in s[\"completed\"],\n    \"boost_hero\": lambda s: 3 in s[\"completed\"],\n    \"voting_veteran\": lambda s: 4 in s[\"completed\"],\n    \"stack_master\": lambda s: 5 in s[\"completed\"],\n    \"champion\": lambda s: 6 in s[\"completed\"],\n    \"quiz_master\": lambda s: s[\"quiz_best\"] >= 4,\n    \"perfect_score\": lambda s: s[\"quiz_best\"] >= QUIZ_LENGTH,\n    \"streak_starter\": lambda s: s[\"best_streak\"] >= 3,\n    \"hot_streak\": lambda s: s[\"best_streak\"] >= 5,\n    \"theory_reader\": lambda s: len(s[\"read_topics\"]) >= 6,\n    \"experimenter\": lambda s: s[\"trained\"] >= 5,\n}\n\n\ndef init() -> None:\n    if \"game\" not in st.session_state:\n        st.session_state[\"game\"] = copy.deepcopy(DEFAULTS)\n\n\ndef g() -> dict:\n    init()\n    return st.session_state[\"game\"]\n\n\ndef safe_name() -> str:\n    \"\"\"HTML-escaped player name (safe to place inside unsafe_allow_html blocks).\"\"\"\n    return html.escape(g()[\"player\"])\n\n\n# --------------------------------------------------------------- derived\ndef level() -> int:\n    return min(len(g()[\"completed\"]) + 1, len(MISSIONS))\n\n\ndef title() -> str:\n    return TITLES[level()]\n\n\ndef status(mission_id: int) -> str:\n    s = g()\n    if mission_id in s[\"completed\"]:\n        return \"completed\"\n    if mission_id == 1 or (mission_id - 1) in s[\"completed\"]:\n        return \"in_progress\"\n    return \"locked\"\n\n\ndef xp_fraction() -> float:\n    return min(g()[\"xp\"] / XP_GOAL, 1.0)\n\n\n# ---------------------------------------------------------------- actions\ndef add_xp(amount: int, why: str = \"\") -> None:\n    g()[\"xp\"] += int(amount)\n    st.toast(f\"+{amount} XP {why}\".strip(), icon=\"⭐\")\n\n\ndef unlock_check() -> None:\n    s = g()\n    for a in ACHIEVEMENTS:\n        if a[\"id\"] not in s[\"achievements\"] and CONDITIONS[a[\"id\"]](s):\n            s[\"achievements\"].append(a[\"id\"])\n            add_xp(a[\"xp\"], f\"- Achievement: {a['title']}\")\n            st.toast(f\"Achievement unlocked: {a['title']}\", icon=\"🏅\")\n\n\ndef complete_mission(mission_id: int) -> bool:\n    \"\"\"Mark a mission as done (once) and pay its reward. Returns True if newly completed.\"\"\"\n    s = g()\n    if mission_id in s[\"completed\"]:\n        return False\n    s[\"completed\"].append(mission_id)\n    reward = next(m[\"reward\"] for m in MISSIONS if m[\"id\"] == mission_id)\n    add_xp(reward, f\"- Level {mission_id} complete\")\n    unlock_check()\n    return True\n\n\ndef record_answer(correct: bool) -> None:\n    s = g()\n    if correct:\n        s[\"streak\"] += 1\n        s[\"best_streak\"] = max(s[\"best_streak\"], s[\"streak\"])\n    else:\n        s[\"streak\"] = 0\n    unlock_check()\n\n\ndef count_training(n: int = 1) -> None:\n    g()[\"trained\"] += n\n    unlock_check()\n\n\ndef mark_topic_read(topic: str) -> None:\n    s = g()\n    if topic not in s[\"read_topics\"]:\n        s[\"read_topics\"].append(topic)\n        unlock_check()\n\n\ndef set_name(name: str) -> None:\n    g()[\"player\"] = (name or \"\").strip()[:20] or \"Player\"\n\n\ndef reset() -> None:\n    st.session_state[\"game\"] = copy.deepcopy(DEFAULTS)\n    for k in [k for k in st.session_state if k != \"game\"]:\n        del st.session_state[k]\n\n\ndef export_progress() -> str:\n    return json.dumps(g(), indent=2)\n\n\ndef import_progress(text: str) -> None:\n    \"\"\"Load a progress file, validating types so a bad file cannot corrupt the state.\"\"\"\n    data = json.loads(text)\n    if not isinstance(data, dict):\n        raise ValueError(\"Progress file must contain a JSON object.\")\n    new = copy.deepcopy(DEFAULTS)\n    for key, default in DEFAULTS.items():\n        if key not in data:\n            continue\n        v = data[key]\n        if isinstance(default, bool) or not isinstance(v, type(default)):\n            raise ValueError(f\"Invalid value for '{key}'.\")\n        new[key] = v\n    new[\"player\"] = new[\"player\"].strip()[:20] or \"Player\"\n    for k in (\"xp\", \"streak\", \"best_streak\", \"quiz_best\", \"trained\", \"voting_correct\"):\n        new[k] = max(0, min(int(new[k]), 10**6))\n    new[\"completed\"] = [int(m) for m in new[\"completed\"] if m in range(1, len(MISSIONS) + 1)]\n    valid_ach = {a[\"id\"] for a in ACHIEVEMENTS}\n    new[\"achievements\"] = [a for a in new[\"achievements\"] if a in valid_ach]\n    st.session_state[\"game\"] = new\n", "app/main.py": "\"\"\"ML Battle Arena - entry point.   Run with:  streamlit run app/main.py\"\"\"\nimport sys\nfrom pathlib import Path\n\nsys.path.insert(0, str(Path(__file__).resolve().parents[1]))  # make `src` and `app` importable\n\nimport streamlit as st  # noqa: E402\n\nfrom app import style  # noqa: E402\nfrom app.game import state  # noqa: E402\n\nst.set_page_config(page_title=\"Ensemble Learning - ML Battle Arena\", page_icon=\"🎮\", layout=\"wide\")\nstate.init()\nstyle.inject()\nstyle.header()\n\npages = [\n    st.Page(\"pages/home.py\", title=\"Home\", icon=\"🏠\", default=True),\n    st.Page(\"pages/missions.py\", title=\"Missions\", icon=\"🎯\"),\n    st.Page(\"pages/playground.py\", title=\"Algorithm Playground\", icon=\"🧪\"),\n    st.Page(\"pages/theory.py\", title=\"Theory Library\", icon=\"📚\"),\n    st.Page(\"pages/quiz.py\", title=\"Quizzes\", icon=\"📝\"),\n    st.Page(\"pages/leaderboard.py\", title=\"Leaderboard\", icon=\"🏆\"),\n    st.Page(\"pages/achievements.py\", title=\"Achievements\", icon=\"⭐\"),\n    st.Page(\"pages/settings.py\", title=\"Settings\", icon=\"⚙️\"),\n]\nnav = st.navigation(pages)\nwith st.sidebar:\n    st.divider()\n    style.player_card(compact=True)\nnav.run()\n", "app/missions/__init__.py": "\"\"\"One module per mission (level).\"\"\"\n", "app/missions/common.py": "\"\"\"Helpers shared by all missions.\"\"\"\nimport streamlit as st\n\nfrom src.data import SplitData, make_demo_data, split_data\nfrom app.game import state\n\n\ndef arena_data(noise: float = 0.3, seed: int = 7):\n    \"\"\"Small 2-D 'two moons' data used by Levels 2-5 (so decision boundaries can be drawn).\"\"\"\n    ds = make_demo_data(400, noise, seed)\n    return ds, split_data(ds, 0.3, seed)\n\n\ndef flags() -> dict:\n    return state.g()[\"flags\"]\n\n\ndef check_question(mid: int, question: str, options: list[str], answer: int, explain: str) -> bool:\n    \"\"\"Multiple-choice checkpoint. Returns True once passed (stored in progress).\"\"\"\n    s = state.g()\n    st.markdown(f\"**🎯 Checkpoint:** {question}\")\n    if mid in s[\"checks\"]:\n        st.success(\"✅ Checkpoint passed. \" + explain)\n        return True\n    choice = st.radio(\"Your answer\", options, index=None, key=f\"chk_{mid}\", label_visibility=\"collapsed\")\n    if st.button(\"Submit answer\", key=f\"chk_btn_{mid}\"):\n        if choice is None:\n            st.warning(\"Pick an answer first.\")\n        else:\n            ok = options.index(choice) == answer\n            state.record_answer(ok)\n            if ok:\n                s[\"checks\"].append(mid)\n                st.success(\"✅ Correct! \" + explain)\n                return True\n            st.error(\"Not quite - think about it and try again.\")\n    return False\n\n\ndef objective(done: bool, text: str) -> None:\n    st.markdown((\"✅ \" if done else \"⬜ \") + f\"**Objective:** {text}\")\n\n\ndef finish(mid: int, objective_done: bool) -> None:\n    \"\"\"Complete the mission when objective + checkpoint are both done.\"\"\"\n    s = state.g()\n    if mid in s[\"completed\"]:\n        st.success(\"🏅 Mission completed!\")\n        return\n    if objective_done and mid in s[\"checks\"]:\n        if state.complete_mission(mid):\n            st.balloons()\n            st.success(\"🎉 Mission complete! Reward added to your score.\")\n    else:\n        st.info(\"Finish the objective and pass the checkpoint to complete this mission.\")\n", "app/missions/level1.py": "\"\"\"Level 1 - Prediction Rookie: train a Decision Tree, learn accuracy basics.\"\"\"\nimport streamlit as st\n\nfrom src import plots\nfrom src.data import BREAST_CANCER, load_dataset, split_data\nfrom src.models import TREE\nfrom src.training import train_and_evaluate\nfrom app.game import state\nfrom app.missions.common import check_question, finish, flags, objective\nfrom src.ui import show_plotly\n\nMID, TARGET = 1, 0.94\n\n\ndef render() -> None:\n    st.markdown(\n        \"A **prediction** is a model's best guess for a new sample. **Accuracy** = correct predictions ÷ all predictions, \"\n        \"but accuracy alone can hide mistakes, so we also look at **precision** (when I say *positive*, am I right?) and \"\n        \"**recall** (of all real positives, how many did I find?).\\n\\n\"\n        \"**Your task:** train a Decision Tree on the *Breast Cancer* dataset and reach at least **94% accuracy**.\"\n    )\n    ds = load_dataset(BREAST_CANCER)\n    split = split_data(ds, 0.25, 42)\n    a, b = st.columns(2)\n    depth = a.slider(\"Tree depth\", 1, 10, 1, key=\"m1_depth\", help=\"Depth 1 = one yes/no question. Deeper = more questions.\")\n    leaf = b.slider(\"Min samples per leaf\", 1, 20, 1, key=\"m1_leaf\")\n    if st.button(\"🏋️ Train Decision Tree\", type=\"primary\", key=\"m1_train\"):\n        st.session_state[\"m1_res\"] = train_and_evaluate(TREE, {\"max_depth\": depth, \"min_samples_leaf\": leaf}, split, 42)\n        state.count_training()\n    r = st.session_state.get(\"m1_res\")\n    if r:\n        cols = st.columns(4)\n        for col, (k, v) in zip(cols, r.metrics.items()):\n            col.metric(k, f\"{v:.3f}\")\n        show_plotly(plots.confusion_heatmap(r.confusion, split.class_names, \"Confusion matrix (test set)\"), key=\"m1_cm\")\n        if r.metrics[\"Accuracy\"] >= TARGET:\n            flags()[\"m1\"] = True\n        else:\n            st.info(\"Below 94% - try a different depth. Note that deeper is not always better!\")\n    objective(flags().get(\"m1\", False), f\"reach ≥ {TARGET:.0%} test accuracy\")\n    check_question(MID, \"Which metric tells you how many of the REAL positive cases the model found?\",\n                   [\"Precision\", \"Recall\", \"Training time\", \"Depth\"], 1,\n                   \"Recall = true positives ÷ (true positives + false negatives).\")\n    finish(MID, flags().get(\"m1\", False))\n", "app/missions/level2.py": "\"\"\"Level 2 - Random Forest Squad: bootstrap sampling, tree votes, accuracy vs. number of trees.\"\"\"\nimport numpy as np\nimport pandas as pd\nimport plotly.express as px\nimport streamlit as st\n\nfrom src import plots\nfrom src.models import FOREST, TREE\nfrom src.training import member_prediction_table, train_and_evaluate\nfrom app.game import state\nfrom app.missions.common import arena_data, check_question, finish, flags, objective\nfrom src.ui import show_df, show_plotly\n\nMID, MIN_TREES = 2, 30\n\n\ndef _bootstrap_html(n: int = 20, trees: int = 3, seed: int = 0) -> str:\n    out = \"\"\n    for t in range(trees):\n        counts = np.bincount(np.random.RandomState(seed + t).choice(n, n, replace=True), minlength=n)\n        dots = \"\".join(f'<span class=\"dot {\"on\" if c else \"off\"}\" title=\"row {i}: used {c}x\">{c if c > 1 else \"\"}<\/span>' for i, c in enumerate(counts))\n        out += f'<div class=\"boot-row\"><b>Tree {t + 1}<\/b> &nbsp; {dots}<\/div>'\n    return out\n\n\ndef render() -> None:\n    ds, split = arena_data()\n    st.markdown(\"A **Random Forest** is a squad of decision trees. Each tree trains on a different **bootstrap sample** and the squad **votes**. \"\n                \"Averaging many unstable trees reduces **variance**.\")\n    st.subheader(\"1 · Bootstrap sampling\")\n    st.markdown(\"Each row of dots is one tree's training set of 20 rows. **Filled** = row used (number = used more than once), **faded** = left out (out-of-bag).\",)\n    seed = st.slider(\"Draw\", 0, 40, 0, key=\"m2_boot\")\n    st.markdown(_bootstrap_html(20, 3, seed * 3), unsafe_allow_html=True)\n\n    st.subheader(\"2 · Train your squad\")\n    n_trees = st.slider(\"Number of trees\", 1, 100, 10, key=\"m2_trees\")\n    if st.button(\"🌲 Train Forest\", type=\"primary\", key=\"m2_train\"):\n        forest = train_and_evaluate(FOREST, {\"n_estimators\": n_trees, \"max_depth\": 10}, split, 7)\n        tree = train_and_evaluate(TREE, {\"max_depth\": 20}, split, 7)\n        sweep = [{\"Trees\": n, \"Forest accuracy\": train_and_evaluate(FOREST, {\"n_estimators\": n, \"max_depth\": 10}, split, 7).metrics[\"Accuracy\"]}\n                 for n in (1, 3, 5, 10, 20, 40, 70, 100)]\n        st.session_state[\"m2\"] = dict(forest=forest, tree=tree, sweep=pd.DataFrame(sweep), n=n_trees)\n        state.count_training()\n        if n_trees >= MIN_TREES:\n            flags()[\"m2\"] = True\n    r = st.session_state.get(\"m2\")\n    if r:\n        f, t = r[\"forest\"], r[\"tree\"]\n        c = st.columns(5)\n        for col, (k, v) in zip(c[:4], f.metrics.items()):\n            col.metric(k, f\"{v:.2f}\")\n        c[4].metric(\"Single deep tree\", f\"{t.metrics['Accuracy']:.2f}\")\n        left, right = st.columns(2)\n        with left:\n            st.markdown(f\"**Individual predictions → majority vote** ({r['n']} trees)\")\n            s = st.slider(\"Test sample\", 0, len(split.y_test) - 1, 0, key=\"m2_s\")\n            x = split.X_test[s:s + 1]\n            tbl = member_prediction_table(f.model, x, split.y_test[s:s + 1], ds.class_names, 1, 3)\n            show_df(tbl)\n            votes = np.bincount(np.array([int(e.predict(x)[0]) for e in f.model.estimators_]), minlength=2)\n            st.caption(f\"All {r['n']} trees voted: Class 0 → **{votes[0]}**, Class 1 → **{votes[1]}**  ⇒ forest answer: **{ds.class_names[int(f.model.predict(x)[0])]}**\")\n        with right:\n            fig = px.line(r[\"sweep\"], x=\"Trees\", y=\"Forest accuracy\", markers=True, title=\"Accuracy vs. number of trees\")\n            fig.add_hline(y=t.metrics[\"Accuracy\"], line_dash=\"dash\", annotation_text=\"single deep tree\")\n            fig.update_layout(height=330, margin=dict(t=50, b=10))\n            show_plotly(fig, key=\"m2_sweep\")\n        cols2 = (0, 1)\n        st.pyplot(plots.decision_boundaries({f\"Random Forest ({r['n']} trees)\": f.model, \"Single deep tree\": t.model},\n                                            split.X_train, split.y_train, split.X_test, split.y_test, \"x1\", \"x2\", 2))\n        st.caption(\"Compare the jagged single tree with the smoother forest. More trees usually means smoother boundaries and steadier accuracy.\")\n    objective(flags().get(\"m2\", False), f\"train a forest with at least {MIN_TREES} trees\")\n    check_question(MID, \"Why does averaging many trees reduce variance?\", [\"Each tree gets deeper\", \"Individual trees' random mistakes tend to cancel out\",\n                   \"The trees see the test set\", \"It makes training faster\"], 1,\n                   \"Different bootstrap samples make different mistakes; the majority vote smooths them out.\")\n    finish(MID, flags().get(\"m2\", False))\n", "app/missions/level3.py": "\"\"\"Level 3 - Boosting Challenge: AdaBoost beats a single stump by focusing on mistakes.\"\"\"\nimport streamlit as st\n\nfrom src import plots\nfrom src.models import ADABOOST, TREE\nfrom src.training import staged_scores, train_and_evaluate\nfrom app.game import state\nfrom app.missions.common import arena_data, check_question, finish, flags, objective\nfrom src.ui import show_plotly\n\nMID, MIN_EST = 3, 20\n\n\ndef render() -> None:\n    ds, split = arena_data()\n    st.markdown(\"**Boosting** adds weak models one at a time. After each round, the samples that were **misclassified get more weight**, \"\n                \"so the next model focuses on the mistakes. **Your task:** beat a single *stump* (a depth-1 tree) with AdaBoost using \"\n                f\"at least **{MIN_EST} estimators**.\")\n    a, b = st.columns(2)\n    n = a.slider(\"Number of estimators\", 1, 200, 5, key=\"m3_n\")\n    lr = b.slider(\"Learning rate\", 0.05, 2.0, 1.0, 0.05, key=\"m3_lr\")\n    if st.button(\"🚀 Train AdaBoost\", type=\"primary\", key=\"m3_train\"):\n        ada = train_and_evaluate(ADABOOST, {\"n_estimators\": n, \"learning_rate\": lr, \"max_depth\": 1}, split, 7)\n        stump = train_and_evaluate(TREE, {\"max_depth\": 1}, split, 7)\n        st.session_state[\"m3\"] = dict(ada=ada, stump=stump, curve=staged_scores(ada.model, split), n=n)\n        state.count_training()\n        if n >= MIN_EST and ada.metrics[\"Accuracy\"] > stump.metrics[\"Accuracy\"]:\n            flags()[\"m3\"] = True\n    r = st.session_state.get(\"m3\")\n    if r:\n        c = st.columns(3)\n        c[0].metric(\"Single stump\", f\"{r['stump'].metrics['Accuracy']:.3f}\")\n        c[1].metric(f\"AdaBoost ({r['n']} models)\", f\"{r['ada'].metrics['Accuracy']:.3f}\",\n                    f\"{r['ada'].metrics['Accuracy'] - r['stump'].metrics['Accuracy']:+.3f}\")\n        c[2].metric(\"F1-score\", f\"{r['ada'].metrics['F1-score']:.3f}\")\n        show_plotly(plots.staged_lines({\"AdaBoost\": r[\"curve\"]}), key=\"m3_curve\")\n        last = len(r[\"curve\"])\n        st.pyplot(plots.boosting_snapshots(r[\"ada\"].model, split.X_train, split.y_train, sorted({1, min(3, last), min(10, last), last})))\n        st.caption(\"Watch the boundary: with 1 stump it is a straight cut; each added model bends it to fix earlier mistakes.\")\n        if r[\"n\"] >= MIN_EST and not flags().get(\"m3\"):\n            st.info(\"AdaBoost did not beat the stump this time - try a different learning rate.\")\n    objective(flags().get(\"m3\", False), f\"AdaBoost with ≥ {MIN_EST} estimators scores higher than the single stump\")\n    check_question(MID, \"In boosting, what do later models focus on?\", [\"Random samples\", \"The easiest samples\",\n                   \"The samples earlier models got wrong\", \"The test set\"], 2, \"Mistakes get more weight (AdaBoost) or are fitted directly (Gradient Boosting).\")\n    finish(MID, flags().get(\"m3\", False))\n", "app/missions/level4.py": "\"\"\"Level 4 - Voting Arena: predict the hard / soft vote yourself.\"\"\"\nimport numpy as np\nimport streamlit as st\nfrom sklearn.ensemble import RandomForestClassifier\nfrom sklearn.linear_model import LogisticRegression\nfrom sklearn.pipeline import make_pipeline\nfrom sklearn.preprocessing import StandardScaler\nfrom sklearn.tree import DecisionTreeClassifier\n\nfrom app.game import state\nfrom app.missions.common import arena_data, flags\n\nMID, NEEDED = 4, 3\n\n\ndef _models():\n    \"\"\"Three base models + their test-set probabilities (cached per session).\"\"\"\n    if \"m4_cache\" not in st.session_state:\n        ds, split = arena_data(noise=0.35)\n        ms = {\"Logistic Regression\": make_pipeline(StandardScaler(), LogisticRegression(max_iter=500)),\n              \"Decision Tree\": DecisionTreeClassifier(max_depth=3, random_state=1),\n              \"Random Forest\": RandomForestClassifier(n_estimators=10, max_depth=3, random_state=1)}\n        P = np.stack([m.fit(split.X_train, split.y_train).predict_proba(split.X_test) for m in ms.values()])  # (3, n, 2)\n        hard = (np.argmax(P, axis=2).sum(axis=0) >= 2).astype(int)\n        soft = np.argmax(P.mean(axis=0), axis=1)\n        st.session_state[\"m4_cache\"] = dict(names=list(ms), P=P, disagree=np.where(hard != soft)[0], n=P.shape[1])\n    return st.session_state[\"m4_cache\"]\n\n\ndef _new_round() -> None:\n    c = _models()\n    s = st.session_state.setdefault(\"m4\", dict(counter=0))\n    s[\"counter\"] += 1\n    rng = np.random.RandomState(s[\"counter\"])\n    pool = c[\"disagree\"] if (len(c[\"disagree\"]) and rng.rand() < 0.5) else np.arange(c[\"n\"])\n    s.update(idx=int(rng.choice(pool)), kind=str(rng.choice([\"Hard\", \"Soft\"])), submitted=False, correct=None)\n    st.session_state[\"m4_choice\"] = None\n\n\ndef _submit() -> None:\n    s, c = st.session_state[\"m4\"], _models()\n    choice = st.session_state.get(\"m4_choice\")\n    if choice is None:\n        return\n    P = c[\"P\"][:, s[\"idx\"], :]\n    answer = int(np.argmax(P.mean(axis=0))) if s[\"kind\"] == \"Soft\" else int(np.argmax(P, axis=1).sum() >= 2)\n    s[\"correct\"] = (int(choice[-1]) == answer)\n    s[\"answer\"], s[\"submitted\"] = answer, True\n    state.record_answer(s[\"correct\"])\n    if s[\"correct\"]:\n        state.add_xp(25, \"- correct vote\")\n        state.g()[\"voting_correct\"] += 1\n        if state.g()[\"voting_correct\"] >= NEEDED:\n            flags()[\"m4\"] = True\n            if state.complete_mission(MID):\n                st.balloons()\n\n\ndef render() -> None:\n    st.markdown(\"Three base models each make a prediction. **Hard voting** takes the majority label; **soft voting** averages the probabilities. \"\n                f\"Predict the final answer yourself. **Objective:** get **{NEEDED} rounds right**.\")\n    c = _models()\n    if \"m4\" not in st.session_state:\n        _new_round()\n    s = st.session_state[\"m4\"]\n    P = c[\"P\"][:, s[\"idx\"], :]\n    left, mid, right = st.columns(3)\n    with left:\n        st.markdown(\"##### Base models\")\n        for name, p in zip(c[\"names\"], P):\n            st.markdown(f'<div class=\"model-card\"><b>{name}<\/b><br>Prediction: <b>Class {int(np.argmax(p))}<\/b><br>'\n                        f'<small>Prob: [{p[0]:.2f}, {p[1]:.2f}]<\/small><\/div>', unsafe_allow_html=True)\n    with mid:\n        st.markdown(\"##### Your turn!\")\n        st.write(f\"What will be the final prediction using **{s['kind']} Voting**?\")\n        st.radio(\"Answer\", [\"A. Class 0\", \"B. Class 1\"], index=None, key=\"m4_choice\", disabled=s[\"submitted\"], label_visibility=\"collapsed\")\n        if not s[\"submitted\"]:\n            st.button(\"Submit Answer\", type=\"primary\", key=\"m4_submit\", on_click=_submit)\n        else:\n            st.button(\"Next round ➡\", key=\"m4_next\", on_click=_new_round)\n    with right:\n        st.markdown(\"##### Final results\")\n        if s[\"submitted\"]:\n            view = st.radio(\"Voting type\", [\"Hard\", \"Soft\"], index=0 if s[\"kind\"] == \"Hard\" else 1, horizontal=True, key=\"m4_view\")\n            hv = int(np.argmax(P, axis=1).sum() >= 2)\n            if view == \"Hard\":\n                votes = np.argmax(P, axis=1)\n                st.success(f\"Final prediction: **Class {hv}**\")\n                st.caption(f\"Hard voting takes the majority class: {int((votes == hv).sum())} of 3 models predicted Class {hv}.\")\n            else:\n                avg = P.mean(axis=0)\n                st.success(f\"Final prediction: **Class {int(np.argmax(avg))}**\")\n                st.caption(f\"Soft voting averages probabilities: [{avg[0]:.2f}, {avg[1]:.2f}] → Class {int(np.argmax(avg))}.\")\n            (st.success if s[\"correct\"] else st.error)(\"Correct! +25 XP\" if s[\"correct\"] else f\"Not this time - the answer was Class {s['answer']}.\")\n        else:\n            st.info(\"Submit your answer to reveal the results.\")\n    done = state.g()[\"voting_correct\"]\n    st.progress(min(done / NEEDED, 1.0), text=f\"Correct rounds: {done}/{NEEDED}\")\n    if MID in state.g()[\"completed\"]:\n        st.success(\"🏅 Mission completed! Keep playing for extra XP and streak points.\")\n", "app/missions/level5.py": "\"\"\"Level 5 - Stacking Mastership: a meta-model learns how to combine base models.\"\"\"\nimport pandas as pd\nimport streamlit as st\n\nfrom src import plots\nfrom src.models import STACKING\nfrom src.training import stacking_weights, train_and_evaluate\nfrom app.game import state\nfrom app.missions.common import arena_data, check_question, finish, flags, objective\nfrom src.ui import show_plotly\n\nMID = 5\n\n\ndef render() -> None:\n    ds, split = arena_data()\n    st.markdown(\"**Stacking** trains several base models (here: Decision Tree, Logistic Regression, Random Forest), collects their \"\n                \"**out-of-fold** predictions, and trains a **meta-model** to combine them. **Objective:** train a stack and compare it with its base models.\")\n    cv = st.slider(\"Out-of-fold CV folds\", 2, 10, 5, key=\"m5_cv\")\n    if st.button(\"🧠 Train Stack\", type=\"primary\", key=\"m5_train\"):\n        with st.spinner(\"Training base models and the stack...\"):\n            rs = [train_and_evaluate(n, None, split, 7) for n in (\"Decision Tree\", \"Logistic Regression\", \"Random Forest\")]\n            rs.append(train_and_evaluate(STACKING, {\"cv\": cv}, split, 7))\n        st.session_state[\"m5\"] = rs\n        state.count_training()\n        flags()[\"m5\"] = True\n    rs = st.session_state.get(\"m5\")\n    if rs:\n        show_plotly(plots.metric_bars(pd.DataFrame([{\"Algorithm\": r.name, **r.metrics} for r in rs])), key=\"m5_bars\")\n        show_plotly(plots.weights_bars(stacking_weights(rs[-1].model, 2)), key=\"m5_w\")\n        st.caption(\"The second chart shows how much the meta-model leans on each base model. The stack is **not guaranteed** to win - check the first chart!\")\n    objective(flags().get(\"m5\", False), \"train the stacking model\")\n    check_question(MID, \"Why does stacking use out-of-fold predictions?\", [\"To save time\", \"So base models predict rows they have not seen (no leakage)\",\n                   \"To add more features\", \"To shrink the dataset\"], 1, \"Otherwise the meta-model would over-trust base models that memorised the training rows.\")\n    finish(MID, flags().get(\"m5\", False))\n", "app/missions/level6.py": "\"\"\"Level 6 - Final Championship: pick the best algorithm for a dataset (6-step wizard).\"\"\"\nimport streamlit as st\n\nfrom src import plots\nfrom src.data import BREAST_CANCER, IRIS, SYNTHETIC, load_dataset, split_data\nfrom src.models import ADABOOST, BAGGING, FOREST, GRADBOOST, STACKING, TREE, VOTING\nfrom src.training import results_table, run_experiment\nfrom app.game import state\nfrom src.ui import show_df, show_plotly\n\nMID = 6\nSTEPS = [\"Dataset\", \"Select Models\", \"Configure\", \"Train\", \"Compare\", \"Choose\"]\nMODELS = [TREE, FOREST, BAGGING, ADABOOST, GRADBOOST, VOTING, STACKING]\nTOLERANCE = 0.005\n\n\ndef _s() -> dict:\n    return st.session_state.setdefault(\"champ\", dict(step=0, dataset=BREAST_CANCER, models=[FOREST, TREE], n_est=50, depth=5, run=None, result=None))\n\n\ndef _go(delta: int) -> None:\n    c = _s()\n    c[\"step\"] = max(0, min(len(STEPS) - 1, c[\"step\"] + delta))\n\n\ndef _restart() -> None:\n    st.session_state.pop(\"champ\", None)\n\n\ndef _params(name: str, c: dict) -> dict:\n    p = {TREE: {\"max_depth\": c[\"depth\"]}, FOREST: {\"n_estimators\": c[\"n_est\"], \"max_depth\": c[\"depth\"]},\n         BAGGING: {\"n_estimators\": min(c[\"n_est\"], 200), \"max_depth\": c[\"depth\"]},\n         ADABOOST: {\"n_estimators\": c[\"n_est\"], \"learning_rate\": 0.5, \"max_depth\": 2},\n         GRADBOOST: {\"n_estimators\": c[\"n_est\"], \"max_depth\": min(c[\"depth\"], 6)},\n         VOTING: {\"voting\": \"soft\", \"max_depth\": c[\"depth\"]}, STACKING: {\"cv\": 3, \"rf_estimators\": 30, \"max_depth\": c[\"depth\"]}}\n    return p[name]\n\n\ndef render() -> None:\n    c = _s()\n    st.markdown(\"Choose the **best algorithm** for the dataset. You will train several candidates and then lock in your pick. \"\n                \"The winner is decided by **test F1-score**.\")\n    pills = \"\".join(f'<span class=\"pill {\"now\" if i == c[\"step\"] else \"done\" if i < c[\"step\"] else \"\"}\">{i + 1} {n}<\/span>' for i, n in enumerate(STEPS))\n    st.markdown(pills, unsafe_allow_html=True)\n    step = c[\"step\"]\n    can_next = True\n    if step == 0:\n        c[\"dataset\"] = st.selectbox(\"Select dataset\", [BREAST_CANCER, IRIS, SYNTHETIC], index=[BREAST_CANCER, IRIS, SYNTHETIC].index(c[\"dataset\"]), key=\"ch_ds\")\n    elif step == 1:\n        c[\"models\"] = st.multiselect(\"Choose 2 or more algorithms\", MODELS, default=[m for m in c[\"models\"] if m in MODELS], key=\"ch_models\")\n        can_next = len(c[\"models\"]) >= 2\n        if not can_next:\n            st.warning(\"Select at least two algorithms.\")\n    elif step == 2:\n        a, b = st.columns(2)\n        c[\"n_est\"] = a.slider(\"Number of estimators (ensembles)\", 10, 200, c[\"n_est\"], 10, key=\"ch_n\")\n        c[\"depth\"] = b.slider(\"Max tree depth\", 1, 12, c[\"depth\"], key=\"ch_d\")\n    elif step == 3:\n        st.write(f\"Ready to train **{', '.join(c['models'])}** on **{c['dataset']}**.\")\n        if st.button(\"🏋️ Train all\", type=\"primary\", key=\"ch_train\"):\n            ds = load_dataset(c[\"dataset\"], n_samples=600, n_features=6, seed=11)\n            split = split_data(ds, 0.25, 11)\n            with st.spinner(\"Training...\"):\n                results, errors = run_experiment({m: _params(m, c) for m in c[\"models\"]}, split, 11)\n            c[\"run\"] = dict(results=results, errors=errors, split=split)\n            state.count_training()\n        can_next = bool(c[\"run\"] and c[\"run\"][\"results\"])\n        if c[\"run\"]:\n            for n, e in c[\"run\"][\"errors\"].items():\n                st.error(f\"{n}: {e}\")\n            st.success(f\"Trained {len(c['run']['results'])} model(s).\") if c[\"run\"][\"results\"] else None\n    elif step in (4, 5):\n        run = c[\"run\"]\n        if not run or not run[\"results\"]:\n            st.warning(\"Train some models first (step 4).\")\n            can_next = False\n        else:\n            df = results_table(run[\"results\"])\n            show_df(df.style.format({m: \"{:.3f}\" for m in plots.METRICS} | {\"Train time (s)\": \"{:.4f}\"}))\n            show_plotly(plots.metric_bars(df), key=f\"ch_bars_{step}\")\n            if step == 5:\n                pick = st.selectbox(\"🏆 Your champion\", list(df[\"Algorithm\"]), index=None, placeholder=\"Choose an algorithm\", key=\"ch_pick\")\n                if st.button(\"Lock in my choice\", type=\"primary\", key=\"ch_lock\", disabled=pick is None):\n                    f1 = dict(zip(df[\"Algorithm\"], df[\"F1-score\"]))\n                    best_name, best = max(f1.items(), key=lambda kv: kv[1])\n                    c[\"result\"] = dict(pick=pick, best=best_name, ok=f1[pick] >= best - TOLERANCE)\n                    state.record_answer(c[\"result\"][\"ok\"])\n                    if c[\"result\"][\"ok\"] and state.complete_mission(MID):\n                        st.balloons()\n                res = c[\"result\"]\n                if res:\n                    if res[\"ok\"]:\n                        st.success(f\"🏆 Champion! **{res['pick']}** is (within {TOLERANCE}) the best F1 on this test set.\")\n                    else:\n                        st.error(f\"Not this time - **{res['best']}** had the best F1. Try different settings or a new dataset!\")\n                    st.caption(\"Remember: on a different split another model might win. That is why we compare on the same split and, ideally, several splits.\")\n                    st.button(\"🔁 Play again\", key=\"ch_again\", on_click=_restart)\n    if state.status(MID) == \"completed\" and not c[\"result\"]:\n        st.success(\"🏅 You already completed this mission - feel free to play again!\")\n    nav = st.columns([1, 1, 4])\n    nav[0].button(\"◀ Back\", key=\"ch_back\", disabled=step == 0, on_click=_go, args=(-1,))\n    if step < len(STEPS) - 1:\n        nav[1].button(\"Next ▶\", key=\"ch_next\", type=\"primary\", disabled=not can_next, on_click=_go, args=(1,))\n", "app/pages/__init__.py": "", "app/pages/achievements.py": "\"\"\"Achievements wall.\"\"\"\nimport streamlit as st\n\nfrom app.game import state\nfrom app.game.content import ACHIEVEMENTS\n\nstate.init()\nst.subheader(\"⭐ Achievements\")\ngot = state.g()[\"achievements\"]\nst.progress(len(got) / len(ACHIEVEMENTS), text=f\"{len(got)}/{len(ACHIEVEMENTS)} unlocked\")\ncols = st.columns(4)\nfor i, a in enumerate(ACHIEVEMENTS):\n    on = a[\"id\"] in got\n    cols[i % 4].markdown(f'<div class=\"badge {\"on\" if on else \"off\"}\"><div class=\"ic\">{a[\"icon\"]}<\/div><b>{a[\"title\"]}<\/b><br>'\n                         f'<small>{a[\"desc\"]}<\/small><br><b>{\"+%d XP\" % a[\"xp\"] if on else \"🔒 %d XP\" % a[\"xp\"]}<\/b><\/div>', unsafe_allow_html=True)\n", "app/pages/home.py": "\"\"\"Game Dashboard (Home).\"\"\"\nimport streamlit as st\n\nfrom app import style\nfrom app.game import state\nfrom app.game.content import MISSIONS\n\nstate.init()\nst.subheader(\"🎮 Game Dashboard\")\nleft, right = st.columns([2, 3])\nwith left:\n    style.player_card()\nwith right:\n    s = state.g()\n    done = len(s[\"completed\"])\n    if done == len(MISSIONS):\n        msg = f\"You are an ML Ninja, {state.safe_name()}! Replay any mission or climb the leaderboard.\"\n    elif s[\"xp\"] == 0:\n        msg = f\"Welcome, {state.safe_name()}! Start with Level 1 to earn your first XP.\"\n    else:\n        msg = f\"Great job, {state.safe_name()}! Keep learning and unlock the next level!\"\n    st.markdown(f'<div class=\"banner\">🚩 {msg}<\/div>', unsafe_allow_html=True)\n    style.link(\"pages/missions.py\", \"Continue your mission →\", \"🎯\")\n\nst.markdown(\"### Your Missions\")\nfor col, m in zip(st.columns(len(MISSIONS)), MISSIONS):\n    col.markdown(style.mission_card(m), unsafe_allow_html=True)\n\nst.divider()\na, b, c = st.columns(3)\nwith a:\n    style.link(\"pages/playground.py\", \"Open the Algorithm Playground\", \"🧪\")\nwith b:\n    style.link(\"pages/quiz.py\", \"Take a quick quiz (+50 XP per answer)\", \"📝\")\nwith c:\n    style.link(\"pages/theory.py\", \"Read the Theory Library\", \"📚\")\nst.info(\"**Honest note:** ensembles often help but are *not guaranteed* to beat a single model - the missions let you test that yourself.\")\n", "app/pages/leaderboard.py": "\"\"\"Leaderboard (local demo players + you).\"\"\"\nimport pandas as pd\nimport streamlit as st\n\nfrom app.game import state\nfrom app.game.content import DEMO_PLAYERS\n\nstate.init()\nst.subheader(\"🏆 Leaderboard\")\nme = state.g()[\"player\"]\nrows = [dict(Player=n, Score=s, Level=l) for n, s, l in DEMO_PLAYERS] + [dict(Player=f\"{me} (you)\", Score=state.g()[\"xp\"], Level=state.level())]\ndf = pd.DataFrame(rows).sort_values(\"Score\", ascending=False).reset_index(drop=True)\ndf.insert(0, \"#\", df.index + 1)\nst.dataframe(df.style.apply(lambda r: [\"background-color: rgba(124,92,255,0.35)\" if \"(you)\" in str(r[\"Player\"]) else \"\" for _ in r], axis=1),\n             hide_index=True, width=\"stretch\")\nst.caption(\"The other players are demo entries - this app keeps no server-side scores. Your score lives in this browser session; \"\n           \"use **Settings → Export progress** to save it.\")\n", "app/pages/missions.py": "\"\"\"Missions: pick a level card, then play it.\"\"\"\nimport streamlit as st\n\nfrom app import style\nfrom app.game import state\nfrom app.game.content import MISSIONS\nfrom app.missions import level1, level2, level3, level4, level5, level6\n\nstate.init()\nVIEWS = {1: level1, 2: level2, 3: level3, 4: level4, 5: level5, 6: level6}\n\nst.subheader(\"🎯 Missions\")\nif \"active_mission\" not in st.session_state:\n    st.session_state[\"active_mission\"] = state.level()\n\nfor col, m in zip(st.columns(len(MISSIONS)), MISSIONS):\n    with col:\n        st.markdown(style.mission_card(m), unsafe_allow_html=True)\n        locked = state.status(m[\"id\"]) == \"locked\"\n        if st.button(\"Open\" if not locked else \"Locked\", key=f\"open_{m['id']}\", disabled=locked, width=\"stretch\"):\n            st.session_state[\"active_mission\"] = m[\"id\"]\n\nmid = st.session_state[\"active_mission\"]\nif state.status(mid) == \"locked\":\n    mid = st.session_state[\"active_mission\"] = state.level()\nm = MISSIONS[mid - 1]\nst.divider()\nst.markdown(f\"## {m['icon']} Level {m['id']} · {m['title']}\")\nst.caption(f\"{m['sub']} · Reward: +{m['reward']} XP\")\nVIEWS[mid].render()\n", "app/pages/playground.py": "\"\"\"Algorithm Playground / Live Visualization.\"\"\"\nimport json\nimport time\n\nimport streamlit as st\n\nfrom app.game import state\nfrom src import ui\nfrom src.models import ADABOOST, FOREST, TREE\nfrom src.training import run_experiment\n\nstate.init()\nst.subheader(\"🧪 Algorithm Playground - Live Visualization\")\nst.caption(\"Pick data and algorithms, tune parameters, press **Train Models**, then explore every tab.\")\n\ncfg = ui.dataset_controls(\"pg\")\nselected = ui.algorithm_selector(\"pg\", [TREE, FOREST, ADABOOST])\nsignature = json.dumps({\"cfg\": cfg, \"selected\": selected}, sort_keys=True, default=str)\n\nif st.button(\"🚀 Train Models\", type=\"primary\", key=\"train_button\"):\n    if not selected:\n        st.warning(\"Please select at least one algorithm.\")\n    else:\n        try:\n            ds, split = ui.build_data(cfg)\n        except ValueError as exc:\n            st.error(f\"Invalid data settings: {exc}\")\n        else:\n            with st.spinner(\"Training models...\"):\n                results, errors = run_experiment(selected, split, cfg[\"seed\"])\n            st.session_state[\"last_run\"] = dict(dataset=ds, split=split, results=results, errors=errors, seed=cfg[\"seed\"],\n                                                test_size=cfg[\"test_size\"], selected=selected, signature=signature, id=time.time(), cfg=cfg)\n            state.count_training()\n\nrun = ui.get_last_run()\nif run is None:\n    st.info(\"No results yet - choose algorithms and press **Train Models**.\")\n    st.stop()\nfor name, msg in run[\"errors\"].items():\n    st.error(f\"**{name}** could not be trained: {msg}\")\nif not run[\"results\"]:\n    st.stop()\nif run[\"signature\"] != signature:\n    st.warning(\"Settings changed since the last run - these results are from the **previous run**. Press **Train Models** to update.\")\n\ntabs = st.tabs([\"Dataset\", \"Decision Boundary\", \"Individual Models\", \"Ensemble\", \"Metrics\"])\nwith tabs[0]:\n    ui.render_dataset(run, \"pg_ds\")\nwith tabs[1]:\n    ui.render_boundaries(run, \"pg_bd\")\nwith tabs[2]:\n    ui.render_predictions(run, \"pg_pr\", part=\"table\")\n    ui.render_confusions(run, \"pg_cm\")\nwith tabs[3]:\n    ui.render_predictions(run, \"pg_en\", part=\"members\")\n    st.subheader(\"Boosting iterations\")\n    ui.render_boosting(run, \"pg_bo\")\nwith tabs[4]:\n    ui.render_scores(run, \"pg_sc\")\n    st.subheader(\"Feature importance\")\n    ui.render_importance(run, \"pg_fi\")\n", "app/pages/quiz.py": "\"\"\"Quiz & Challenge: 5 random questions, +50 XP per first-time correct answer.\"\"\"\nimport random\n\nimport streamlit as st\n\nfrom app.game import state\nfrom app.game.content import QUIZ, QUIZ_LENGTH\n\nstate.init()\nst.subheader(\"📝 Quiz & Challenge\")\nBANK = {q[0]: q for q in QUIZ}\n\nTOPICS = {\n    1: \"🗳️ Hard Voting\",\n    2: \"🗳️ Soft Voting\",\n    3: \"🌲 Bagging & Variance\",\n    4: \"🚀 Boosting Fundamentals\",\n    5: \"🌲 Bootstrap Sampling\",\n    6: \"🌲 Out-of-Bag (OOB)\",\n    7: \"🌲 Random Forest\",\n    8: \"📊 Overfitting & Generalization\",\n    9: \"🚀 Decision Stumps & Bias\",\n    10: \"🚀 AdaBoost Sample Weights\",\n    11: \"🚀 Gradient Boosting Residuals\",\n    12: \"🚀 Learning Rate Trade-offs\",\n    13: \"🧠 Stacking & Leakage Prevention\",\n    14: \"🧠 Meta-Learner Role\",\n    15: \"📊 Ensemble Guarantees\",\n    16: \"📊 Pipelines & Data Leakage\",\n    17: \"📈 Evaluation Metrics (Recall)\",\n    18: \"🤝 Model Diversity\",\n}\n\n\ndef _start() -> None:\n    st.session_state[\"quiz\"] = dict(\n        ids=random.sample(list(BANK), QUIZ_LENGTH),\n        i=0,\n        score=0,\n        submitted=False,\n        last_ok=None,\n        done=False,\n        swaps=0,\n    )\n    st.session_state[\"quiz_choice\"] = None\n    st.session_state[\"quiz_notice\"] = None\n\n\ndef _restart() -> None:\n    _start()\n    st.session_state[\"quiz_notice\"] = \"🔄 Quiz restarted with a fresh set of questions!\"\n\n\ndef _swap() -> None:\n    qz = st.session_state.get(\"quiz\")\n    if not qz or qz.get(\"done\") or qz.get(\"submitted\"):\n        return\n    current_qid = qz[\"ids\"][qz[\"i\"]]\n    # Available questions not currently in this quiz set\n    available = [qid for qid in BANK if qid not in qz[\"ids\"]]\n    if not available:\n        available = [qid for qid in BANK if qid != current_qid]\n\n    if available:\n        new_qid = random.choice(available)\n        qz[\"ids\"][qz[\"i\"]] = new_qid\n        qz[\"swaps\"] = qz.get(\"swaps\", 0) + 1\n        qz[\"submitted\"] = False\n        qz[\"last_ok\"] = None\n        st.session_state[\"quiz_choice\"] = None\n        new_topic = TOPICS.get(new_qid, \"General ML\")\n        st.session_state[\"quiz_notice\"] = f\"🔀 Question #{qz['i'] + 1} swapped! New topic: **{new_topic}**.\"\n\n\ndef _submit() -> None:\n    qz = st.session_state[\"quiz\"]\n    qid, _, options, answer, _ = BANK[qz[\"ids\"][qz[\"i\"]]]\n    choice = st.session_state.get(\"quiz_choice\")\n    if choice is None:\n        return\n    ok = options.index(choice) == answer\n    qz.update(submitted=True, last_ok=ok)\n    state.record_answer(ok)\n    if ok:\n        qz[\"score\"] += 1\n        if qid not in state.g()[\"solved\"]:\n            state.g()[\"solved\"].append(qid)\n            state.add_xp(50, \"- correct answer\")\n\n\ndef _next() -> None:\n    qz = st.session_state[\"quiz\"]\n    qz[\"i\"] += 1\n    qz[\"submitted\"], qz[\"last_ok\"] = False, None\n    st.session_state[\"quiz_choice\"] = None\n    if qz[\"i\"] >= QUIZ_LENGTH:\n        qz[\"done\"] = True\n        state.g()[\"quiz_best\"] = max(state.g()[\"quiz_best\"], qz[\"score\"])\n        state.unlock_check()\n\n\nif \"quiz\" not in st.session_state:\n    solved_count = len(state.g()[\"solved\"])\n    st.markdown(\n        \"Answer **5 random questions** drawn from our ML question bank. \"\n        \"Each question you get right for the first time earns **+50 XP**, and consecutive correct answers build your 🔥 streak.\"\n    )\n    col_a, col_b, col_c = st.columns(3)\n    col_a.metric(\"Bank Size\", f\"{len(BANK)} Questions\")\n    col_b.metric(\"Solved by You\", f\"{solved_count}/{len(BANK)}\")\n    col_c.metric(\"Current Streak\", f\"🔥 {state.g()['streak']}\")\n\n    st.markdown(\"💡 *Feature: You can now use **🔀 Swap Question** anytime during the quiz to exchange a tricky question for a fresh one from the bank, or **🔄 Restart Quiz** to get a new set.*\")\n    st.button(\"Start quiz\", type=\"primary\", key=\"quiz_start\", on_click=_start)\n    st.stop()\n\nqz = st.session_state[\"quiz\"]\nif qz[\"done\"]:\n    st.success(f\"Quiz finished! Score: **{qz['score']}/{QUIZ_LENGTH}**\")\n    if qz[\"score\"] == QUIZ_LENGTH:\n        st.balloons()\n    swaps_used = qz.get(\"swaps\", 0)\n    st.markdown(f\"Current streak: 🔥 **{state.g()['streak']}** · Total XP: **{state.g()['xp']}** · Swaps used: **{swaps_used}**\")\n    st.button(\"Play again\", type=\"primary\", key=\"quiz_again\", on_click=_start)\n    st.stop()\n\nqid, text, options, answer, why = BANK[qz[\"ids\"][qz[\"i\"]]]\ntopic = TOPICS.get(qid, \"General ML\")\nunused_in_bank = len(BANK) - len(qz[\"ids\"])\n\n# Header bar with progress, topic tag, and streak/swap counters\nh_col1, h_col2 = st.columns([3, 1])\nwith h_col1:\n    st.progress((qz[\"i\"] + 1) / QUIZ_LENGTH, text=f\"Question {qz['i'] + 1}/{QUIZ_LENGTH} · {topic}\")\nwith h_col2:\n    swaps_used = qz.get(\"swaps\", 0)\n    st.caption(f\"🔥 Streak: **{state.g()['streak']}** | 🔀 Swaps: **{swaps_used}**\")\n\nnotice = st.session_state.pop(\"quiz_notice\", None)\nif notice:\n    st.info(notice, icon=\"ℹ️\")\n\nst.markdown(f\"### {text}\")\nst.radio(\"Choose an answer\", options, index=None, key=\"quiz_choice\", disabled=qz[\"submitted\"], label_visibility=\"collapsed\")\n\nif not qz[\"submitted\"]:\n    btn_col1, btn_col2, btn_col3 = st.columns([2, 1, 1])\n    with btn_col1:\n        st.button(\"Submit Answer\", type=\"primary\", key=\"quiz_submit\", on_click=_submit, width=\"stretch\")\n    with btn_col2:\n        st.button(\"🔀 Swap Question\", key=\"quiz_swap\", on_click=_swap, help=f\"Exchange this question with one of the {unused_in_bank} unused questions in the bank\", width=\"stretch\")\n    with btn_col3:\n        st.button(\"🔄 Restart Quiz\", key=\"quiz_restart\", on_click=_restart, help=\"Restart the quiz with a fresh set of questions\", width=\"stretch\")\nelse:\n    if qz[\"last_ok\"]:\n        st.success(f\"✅ Correct! {why}\")\n    else:\n        st.error(f\"❌ Not quite. Correct answer: **{options[answer]}**. {why}\")\n    btn_col1, btn_col2 = st.columns([3, 1])\n    with btn_col1:\n        st.button(\"Next Question\" if qz[\"i\"] < QUIZ_LENGTH - 1 else \"Finish\", type=\"primary\", key=\"quiz_next\", on_click=_next, width=\"stretch\")\n    with btn_col2:\n        st.button(\"🔄 Restart Quiz\", key=\"quiz_restart_submitted\", on_click=_restart, help=\"Restart the quiz with a fresh set of questions\", width=\"stretch\")\n\n", "app/pages/settings.py": "\"\"\"Settings: player name, save / load progress, reset.\"\"\"\nimport streamlit as st\n\nfrom app.game import state\n\nstate.init()\nst.subheader(\"⚙️ Settings\")\nname = st.text_input(\"Player name (max 20 characters)\", value=state.g()[\"player\"], max_chars=20, key=\"set_name\")\nif name != state.g()[\"player\"]:\n    state.set_name(name)\n\nst.markdown(\"#### Save / load progress\")\nst.download_button(\"⬇ Export progress (JSON)\", state.export_progress(), file_name=\"ml_battle_arena_progress.json\", mime=\"application/json\")\nup = st.file_uploader(\"Import a progress file\", type=\"json\", key=\"set_upload\")\nif up is not None and st.button(\"Load progress\", key=\"set_load\"):\n    try:\n        state.import_progress(up.getvalue().decode(\"utf-8\"))\n        st.success(\"Progress loaded.\")\n        st.rerun()\n    except (ValueError, UnicodeDecodeError) as exc:  # json.JSONDecodeError is a ValueError\n        st.error(f\"Could not load that file: {exc}\")\n\nst.markdown(\"#### Danger zone\")\nif st.checkbox(\"I understand this erases my XP, missions and achievements\", key=\"set_confirm\"):\n    if st.button(\"Reset all progress\", key=\"set_reset\"):\n        state.reset()\n        st.rerun()\n", "app/pages/theory.py": "\"\"\"Theory Library.\"\"\"\nimport streamlit as st\n\nfrom app.game import state\nfrom app.game.content import THEORY\nfrom src import content as C\n\nstate.init()\nst.subheader(\"📚 Theory Library\")\nmenu, body = st.columns([1, 3])\nwith menu:\n    topic = st.radio(\"Topics\", list(THEORY), key=\"theory_topic\", label_visibility=\"collapsed\")\nwith body:\n    md, dot = THEORY[topic]\n    st.markdown(f\"## {topic}\")\n    if topic == \"Interview Q&A\":\n        for cat, q, a in C.INTERVIEW_QA:\n            with st.expander(f\"{q}  ·  _{cat}_\"):\n                st.markdown(a)\n    else:\n        st.markdown(md)\n        if dot:\n            st.graphviz_chart(dot)\n    state.mark_topic_read(topic)\n    st.caption(f\"Topics read: {len(state.g()['read_topics'])}/{len(THEORY)} (read 6 for the Bookworm badge)\")\n", "app/style.py": "\"\"\"Dark 'arena' styling and small HTML building blocks.\"\"\"\nimport streamlit as st\n\nfrom .game import state\nfrom .game.content import ACHIEVEMENTS, MISSIONS, XP_GOAL\n\nCSS = \"\"\"\n<style>\n.arena-title{font-size:2.1rem;font-weight:900;line-height:1.05;letter-spacing:.5px;\n  background:linear-gradient(90deg,#7C9CFF,#B28CFF);-webkit-background-clip:text;color:transparent}\n.arena-title span{background:linear-gradient(90deg,#FFB347,#FF7A18);-webkit-background-clip:text;color:transparent}\n.arena-tag{color:#8FA3FF;letter-spacing:2px;font-size:.9rem}\n.perk{text-align:center;font-size:.8rem;color:#C9D3FF}.perk b{display:block;font-size:1.5rem}\n.panel{background:#131B3D;border:1px solid #26336B;border-radius:14px;padding:14px 16px;margin-bottom:10px}\n.stat{background:#10173A;border:1px solid #26336B;border-radius:10px;padding:8px 12px;text-align:center}\n.stat small{color:#8FA3FF;display:block}.stat b{font-size:1.5rem}\n.banner{background:linear-gradient(90deg,#3A2A9C,#1F5FBF);border-radius:12px;padding:14px 18px;font-weight:600;margin:8px 0 14px}\n.mcard{border-radius:12px;padding:12px;border:1px solid #26336B;background:#10173A;min-height:128px}\n.mcard.completed{border-color:#2FB36B;background:#0F2A23}\n.mcard.in_progress{border-color:#7C5CFF;background:#1A1850;box-shadow:0 0 14px rgba(124,92,255,.45)}\n.mcard.locked{opacity:.55}\n.mcard .lv{font-size:.75rem;color:#8FA3FF}.mcard .tt{font-weight:800;margin:2px 0}.mcard .sb{font-size:.78rem;color:#B9C4F5}\n.mcard .stt{margin-top:8px;font-size:.78rem;font-weight:700}\n.badge{border-radius:12px;padding:12px;border:1px solid #26336B;background:#10173A;text-align:center;min-height:132px}\n.badge.on{border-color:#F5B301;background:#2A2410}.badge.off{opacity:.45;filter:grayscale(1)}\n.badge .ic{font-size:2rem}.badge small{color:#B9C4F5}\n.boot-row{margin:4px 0}.dot{display:inline-block;width:20px;height:20px;border-radius:50%;margin:1px 2px;text-align:center;\n  font-size:.7rem;line-height:20px;border:2px solid #7C9CFF}.dot.on{background:#7C9CFF;color:#0B1026}.dot.off{opacity:.35}\n.pill{display:inline-block;padding:4px 12px;border-radius:999px;border:1px solid #26336B;margin-right:6px;font-size:.8rem}\n.pill.now{background:#7C5CFF;border-color:#7C5CFF}.pill.done{background:#1F6F4A;border-color:#2FB36B}\n.model-card{background:#10173A;border:1px solid #26336B;border-radius:12px;padding:10px 12px;margin-bottom:8px}\n.me{background:#1A1850}\n<\/style>\n\"\"\"\n\n\ndef inject() -> None:\n    st.markdown(CSS, unsafe_allow_html=True)\n\n\ndef header() -> None:\n    left, right = st.columns([2, 3])\n    with left:\n        st.markdown('<div class=\"arena-title\">ENSEMBLE LEARNING<br><span>ML BATTLE ARENA<\/span><\/div>'\n                    '<div class=\"arena-tag\">Learn • Play • Build • Become an ML Ninja<\/div>', unsafe_allow_html=True)\n    with right:\n        perks = [(\"🎮\", f\"{len(MISSIONS)} Levels\"), (\"🧠\", \"Interactive Visualizations\"), (\"🏆\", \"XP & Achievements\"),\n                 (\"📖\", \"Theory Library\"), (\"📝\", \"Quizzes & Challenges\"), (\"📊\", \"Leaderboard\")]\n        for col, (ic, label) in zip(st.columns(len(perks)), perks):\n            col.markdown(f'<div class=\"perk\"><b>{ic}<\/b>{label}<\/div>', unsafe_allow_html=True)\n\n\ndef player_card(compact: bool = False) -> None:\n    s = state.g()\n    xp = min(s[\"xp\"], XP_GOAL)\n    st.markdown(f'<div class=\"panel\"><b>🧑‍💻 Player: {state.safe_name()}<\/b><br>'\n                f'<small>Level {state.level()} - {state.title()}<\/small><\/div>', unsafe_allow_html=True)\n    st.progress(state.xp_fraction(), text=f\"{xp} / {XP_GOAL} XP\" + (\"+\" if s[\"xp\"] > XP_GOAL else \"\"))\n    if not compact:\n        a, b, c = st.columns(3)\n        a.markdown(f'<div class=\"stat\"><small>Total Score<\/small><b>{s[\"xp\"]}<\/b><\/div>', unsafe_allow_html=True)\n        b.markdown(f'<div class=\"stat\"><small>Achievements<\/small><b>🏆 {len(s[\"achievements\"])}/{len(ACHIEVEMENTS)}<\/b><\/div>', unsafe_allow_html=True)\n        c.markdown(f'<div class=\"stat\"><small>Current Streak<\/small><b>🔥 {s[\"streak\"]}<\/b><\/div>', unsafe_allow_html=True)\n\n\nLABEL = {\"completed\": \"✔ Completed\", \"in_progress\": \"▶ In Progress\", \"locked\": \"🔒 Locked\"}\nCOLOR = {\"completed\": \"#2FB36B\", \"in_progress\": \"#9C8CFF\", \"locked\": \"#8A93B8\"}\n\n\ndef mission_card(m: dict) -> str:\n    stt = state.status(m[\"id\"])\n    return (f'<div class=\"mcard {stt}\"><div class=\"lv\">Level {m[\"id\"]}<\/div><div class=\"tt\">{m[\"icon\"]} {m[\"title\"]}<\/div>'\n            f'<div class=\"sb\">{m[\"sub\"]}<\/div><div class=\"stt\" style=\"color:{COLOR[stt]}\">{LABEL[stt]} · +{m[\"reward\"]} XP<\/div><\/div>')\n\n\ndef link(path: str, label: str, icon: str = \"\") -> None:\n    \"\"\"page_link that degrades gracefully when a page runs outside st.navigation.\"\"\"\n    from streamlit.errors import StreamlitPageNotFoundError\n\n    try:\n        st.page_link(path, label=label, icon=icon or None)\n    except StreamlitPageNotFoundError:\n        st.caption(f\"{icon} {label}\")\n", "src/__init__.py": "\"\"\"Core (UI-independent) logic for the Ensemble Learning Visualizer.\"\"\"\n", "src/content.py": "\"\"\"All teaching text lives here so pages stay short and easy to edit.\"\"\"\n\n_STYLE = 'rankdir=LR; bgcolor=\"transparent\"; node [shape=box, style=\"rounded,filled\", fontname=\"Helvetica\", fontcolor=\"#111111\"]; edge [color=\"#888888\"];'\n\nDOT_SINGLE_VS_ENSEMBLE = f\"\"\"digraph G {{ {_STYLE}\n  subgraph cluster_a {{ label=\"Single model\"; fontcolor=\"#888888\"; color=\"#888888\";\n    D1 [label=\"Data\", fillcolor=\"#E8E8E8\"]; M [label=\"One model\", fillcolor=\"#F6C6C6\"]; P1 [label=\"Prediction\", fillcolor=\"#CDE8CD\"]; D1 -> M -> P1; }}\n  subgraph cluster_b {{ label=\"Ensemble\"; fontcolor=\"#888888\"; color=\"#888888\";\n    D2 [label=\"Data\", fillcolor=\"#E8E8E8\"];\n    A [label=\"Model A\", fillcolor=\"#CFE0F5\"]; B [label=\"Model B\", fillcolor=\"#CFE0F5\"]; C [label=\"Model C\", fillcolor=\"#CFE0F5\"];\n    V [label=\"Combine\\\\n(vote / average /\\\\nmeta-model)\", fillcolor=\"#FBE3B5\"]; P2 [label=\"Final prediction\", fillcolor=\"#CDE8CD\"];\n    D2 -> A; D2 -> B; D2 -> C; A -> V; B -> V; C -> V; V -> P2; }}\n}}\"\"\"\n\nDOT_VOTING = f\"\"\"digraph G {{ {_STYLE}\n  X [label=\"New sample\", fillcolor=\"#E8E8E8\"];\n  A [label=\"Logistic Reg.\\\\n→ Class 1\", fillcolor=\"#CFE0F5\"]; B [label=\"Decision Tree\\\\n→ Class 0\", fillcolor=\"#CFE0F5\"]; C [label=\"KNN\\\\n→ Class 1\", fillcolor=\"#CFE0F5\"];\n  V [label=\"Majority vote\\\\n(2 vs 1)\", fillcolor=\"#FBE3B5\"]; F [label=\"Class 1\", fillcolor=\"#CDE8CD\"];\n  X -> A; X -> B; X -> C; A -> V; B -> V; C -> V; V -> F; }}\"\"\"\n\nDOT_BAGGING = f\"\"\"digraph G {{ {_STYLE}\n  D [label=\"Training set\", fillcolor=\"#E8E8E8\"];\n  S1 [label=\"Bootstrap\\\\nsample 1\", fillcolor=\"#FBE3B5\"]; S2 [label=\"Bootstrap\\\\nsample 2\", fillcolor=\"#FBE3B5\"]; S3 [label=\"Bootstrap\\\\nsample 3\", fillcolor=\"#FBE3B5\"];\n  T1 [label=\"Tree 1\", fillcolor=\"#CFE0F5\"]; T2 [label=\"Tree 2\", fillcolor=\"#CFE0F5\"]; T3 [label=\"Tree 3\", fillcolor=\"#CFE0F5\"];\n  V [label=\"Vote / average\", fillcolor=\"#FBE3B5\"]; F [label=\"Prediction\", fillcolor=\"#CDE8CD\"];\n  D -> S1 -> T1 -> V; D -> S2 -> T2 -> V; D -> S3 -> T3 -> V; V -> F; }}\"\"\"\n\nDOT_BOOSTING = f\"\"\"digraph G {{ {_STYLE}\n  D [label=\"Training set\\\\n(equal weights)\", fillcolor=\"#E8E8E8\"];\n  M1 [label=\"Weak model 1\", fillcolor=\"#CFE0F5\"]; W1 [label=\"Increase weight of\\\\nmistakes\", fillcolor=\"#F6C6C6\"];\n  M2 [label=\"Weak model 2\", fillcolor=\"#CFE0F5\"]; W2 [label=\"Increase weight of\\\\nmistakes\", fillcolor=\"#F6C6C6\"];\n  M3 [label=\"Weak model 3\", fillcolor=\"#CFE0F5\"]; F [label=\"Weighted sum\\\\nof all models\", fillcolor=\"#CDE8CD\"];\n  D -> M1 -> W1 -> M2 -> W2 -> M3 -> F; }}\"\"\"\n\nDOT_STACKING = f\"\"\"digraph G {{ {_STYLE}\n  D [label=\"Training set\", fillcolor=\"#E8E8E8\"];\n  A [label=\"Decision Tree\", fillcolor=\"#CFE0F5\"]; B [label=\"Logistic Reg.\", fillcolor=\"#CFE0F5\"]; C [label=\"Random Forest\", fillcolor=\"#CFE0F5\"];\n  O [label=\"Out-of-fold\\\\npredictions\\\\n(new features)\", fillcolor=\"#FBE3B5\"]; M [label=\"Meta-model\\\\n(Logistic Regression)\", fillcolor=\"#F6C6C6\"]; F [label=\"Final prediction\", fillcolor=\"#CDE8CD\"];\n  D -> A; D -> B; D -> C; A -> O; B -> O; C -> O; O -> M -> F; }}\"\"\"\n\nINTRO_MD = \"\"\"\n### What is ensemble learning?\nEnsemble learning trains **several models** and **combines their answers** into one prediction.\nThink of asking a panel of doctors instead of one: individual doctors make different mistakes, and when\nthey are combined, many of those mistakes cancel out.\n\n### Why do we use it?\n- **Lower variance** - averaging many unstable models (e.g. deep trees) gives a steadier result (*bagging*).\n- **Lower bias** - many simple models added one after another can learn complex patterns (*boosting*).\n- **Best of several worlds** - different model families make different mistakes (*voting, stacking*).\n\nThe key ingredient is **diversity**: if every model makes the *same* mistake, combining them changes nothing.\n\"\"\"\n\nSINGLE_VS_ENSEMBLE = [\n    (\"Training\", \"One model\", \"Many models + a combination rule\"),\n    (\"Stability\", \"Can change a lot if the data changes slightly\", \"Usually more stable\"),\n    (\"Accuracy\", \"Good baseline\", \"Often better, **not guaranteed**\"),\n    (\"Interpretability\", \"Easier to explain (e.g. one tree)\", \"Harder to explain\"),\n    (\"Speed / memory\", \"Fast and small\", \"Slower and larger (N models)\"),\n]\n\nPROS = [\"Often higher and more stable accuracy\", \"Reduces overfitting (bagging) or underfitting (boosting)\",\n        \"Works well on tabular data\", \"Many flexible, ready-made implementations\"]\nCONS = [\"Slower to train and predict\", \"Harder to interpret\", \"More hyper-parameters to tune\",\n        \"May give little or no gain if the base model is already strong or the data is tiny/noisy\"]\nAPPLICATIONS = [\n    (\"Finance\", \"Credit scoring and fraud detection (gradient boosting is very common).\"),\n    (\"Healthcare\", \"Disease risk prediction from lab results - e.g. the Breast Cancer dataset in this app.\"),\n    (\"E-commerce\", \"Recommendation and click-through-rate prediction.\"),\n    (\"Competitions\", \"Most winning tabular-data solutions on Kaggle use boosting or stacking.\"),\n    (\"Cyber-security\", \"Malware and intrusion detection with random forests.\"),\n]\n\nVOTING_MD = \"\"\"\n**Voting** trains several *different* models on the **same** data and lets them vote.\n\n| | Hard voting | Soft voting |\n|---|---|---|\n| Each model gives | a class label | class probabilities |\n| Final answer | the label with most votes | the class with the highest **average probability** |\n| Needs `predict_proba`? | No | Yes |\n| Good when | models are roughly equally good | models are well-calibrated; confident models should count more |\n\n*Example:* three models predict P(class 1) = 0.9, 0.4, 0.4. Hard voting sees labels 1, 0, 0 → **class 0**.\nSoft voting averages to 0.57 → **class 1**. The two rules can disagree!\n\"\"\"\n\nBAGGING_MD = \"\"\"\n**Bagging = Bootstrap AGGregatING.**\n1. Draw many **bootstrap samples** (random rows *with replacement*, same size as the training set).\n2. Train one model on each sample - this can be done **in parallel**.\n3. Combine by majority vote (classification) or average (regression).\n\nBecause each tree sees slightly different data, each makes different mistakes. Averaging them **reduces variance**\n(overfitting to noise) without increasing bias much. Each bootstrap sample contains about **63.2%** of the unique rows;\nthe other ~36.8% are **out-of-bag (OOB)** and can be used as a free validation set.\n\n**Random Forest** = bagging of decision trees **plus** a random subset of features considered at every split.\nThat extra randomness makes the trees even more different from each other.\n\"\"\"\n\nBOOSTING_MD = \"\"\"\n**Boosting** trains models **one after another**; each new model focuses on what the previous ones got wrong.\n\n- **AdaBoost** - raises the *weights* of misclassified samples, so the next weak learner (often a depth-1 \"stump\")\n  concentrates on them. Models with lower error get a larger say in the final vote.\n- **Gradient Boosting** - each new tree is fitted to the *errors (gradients of the loss)* of the current ensemble,\n  then added with a small step called the **learning rate**.\n- **HistGradientBoosting** - gradient boosting that first bins features into histograms; much faster on large data.\n- **XGBoost** (concept) - an engineered gradient-boosting library with regularisation, second-order gradient\n  information, built-in handling of missing values and parallel tree building. It is used in this app only if\n  `pip install xgboost` has been run.\n\nBoosting mainly **reduces bias**, but with too many iterations or a high learning rate it can overfit - watch the\ngap between the train and test curves.\n\"\"\"\n\nSTACKING_MD = \"\"\"\n**Stacking** learns *how* to combine models instead of using a fixed rule.\n1. Train several **base models** (here: Decision Tree, Logistic Regression, Random Forest).\n2. For every training row, collect each base model's prediction made **while that row was held out** -\n   these are **out-of-fold (OOF) predictions** from cross-validation.\n3. Train a **meta-model** (here: Logistic Regression) on those OOF predictions to produce the final answer.\n\nWhy out-of-fold? If a base model predicted rows it had already *seen*, its predictions would look unrealistically\ngood and the meta-model would learn to over-trust it (**leakage**).\n\"\"\"\n\nCONCEPTS = [\n    (\"Bias vs. variance\", \"\"\"\n**Bias** = error from a model being too simple (it misses real patterns). **Variance** = error from a model being too\nsensitive to the particular training sample (it chases noise). Total error ≈ bias² + variance + irreducible noise.\n- Deep decision tree: low bias, **high variance**. → *Bagging* lowers variance.\n- Decision stump: **high bias**, low variance. → *Boosting* lowers bias.\n\"\"\"),\n    (\"Overfitting and underfitting\", \"\"\"\n- **Underfitting**: poor on both training and test data (model too simple).\n- **Overfitting**: great on training data, noticeably worse on test data (model memorised noise).\n- Diagnose by comparing train vs. test scores - the *Boosting curves* in the playground show this gap directly.\n\"\"\"),\n    (\"Bootstrap sampling\", \"\"\"\nDraw *n* rows from *n* rows **with replacement**. Chance a given row is never picked = (1 − 1/n)ⁿ → 1/e ≈ **36.8%**,\nso a bootstrap sample holds ≈ **63.2%** unique rows (some repeated). Try it in the Bagging tab.\n\"\"\"),\n    (\"Majority voting\", \"\"\"\nEach model casts one vote for a class; the class with the most votes wins. With *independent* voters that are each\nbetter than chance, accuracy grows as you add voters (see the slider demo in *Introduction*). Real models are correlated,\nso the gain is smaller.\n\"\"\"),\n    (\"Hard voting vs. soft voting\", \"\"\"\nHard = count labels. Soft = average probabilities (so a confident model counts more than an unsure one). Soft voting\nusually performs equal or better when probabilities are reasonable, but needs `predict_proba`.\n\"\"\"),\n    (\"Bagging vs. boosting\", \"\"\"\n| | Bagging | Boosting |\n|---|---|---|\n| Training | independent, parallel | sequential, each model depends on the last |\n| Base model | strong / high-variance (deep trees) | weak / high-bias (stumps, shallow trees) |\n| Main effect | reduces **variance** | reduces **bias** |\n| Overfitting with more models | rarely | possible |\n| Noise sensitivity | robust | can chase noisy labels |\n\"\"\"),\n    (\"Random Forest vs. Decision Tree\", \"\"\"\nA single tree is easy to read but unstable. A forest averages many trees trained on bootstrap samples with random\nfeature subsets → better accuracy and stability, at the cost of interpretability and speed.\n\"\"\"),\n    (\"AdaBoost vs. Gradient Boosting\", \"\"\"\n| | AdaBoost | Gradient Boosting |\n|---|---|---|\n| How it focuses on errors | re-weights **samples** | fits new trees to the **gradient (residual errors)** of a loss |\n| Weak learner | usually stumps | shallow trees (depth 3-6) |\n| Loss | exponential-loss-like | any differentiable loss |\n| Flexibility | lower | higher (basis of XGBoost, LightGBM...) |\n\"\"\"),\n    (\"Stacking vs. voting\", \"\"\"\nVoting uses a **fixed** rule (count or average). Stacking **learns** the rule with a meta-model, so it can trust\ngood models more and ignore weak ones - but it needs more data and cross-validation, and is easier to overfit/leak.\n\"\"\"),\n    (\"Out-of-bag (OOB) evaluation\", \"\"\"\nEach tree in a bagged ensemble never saw ≈ 36.8% of the rows. Predict every row using only the trees that did *not*\ntrain on it and you get a validation score **without a separate validation set**. Use the demo below to compare it\nwith a real test score.\n\"\"\"),\n    (\"Feature importance and its limitations\", \"\"\"\nTree ensembles report how much each feature reduced impurity. Limitations:\n- Biased toward features with many distinct values.\n- **Correlated features share** (and hide) importance.\n- Computed on **training** data, so it can rank features that only help overfit.\n- Says *how much* a feature is used, not *in which direction* or *why*.\n\n**Permutation importance** (shuffle one feature on the test set and measure the accuracy drop) is more reliable and\nworks for any model - the playground can show both.\n\"\"\"),\n]\n\n# (category, question, answer)\nINTERVIEW_QA = [\n    (\"Basics\", \"What is ensemble learning?\",\n     \"Combining several models so the group predicts better than a typical single model. Example: 100 trees voting in a Random Forest.\"),\n    (\"Basics\", \"Why do ensembles often work better?\",\n     \"Different models make different errors; combining them cancels some of those errors (lower variance) or fixes systematic ones (lower bias). This needs *diversity* - identical models add nothing.\"),\n    (\"Basics\", \"Explain bias and variance with an example.\",\n     \"A depth-1 tree is too simple for curved data (high bias). A fully grown tree memorises noise and changes a lot with new data (high variance). Ensembles target one or the other.\"),\n    (\"Basics\", \"What is overfitting and how do you detect it?\",\n     \"The model fits training noise. Detect it by a large gap between training and validation/test score, e.g. 100% train vs 85% test.\"),\n    (\"Bagging\", \"What is bootstrap sampling?\",\n     \"Sampling n rows from n rows with replacement. About 63.2% of rows appear at least once; the rest are out-of-bag.\"),\n    (\"Bagging\", \"How does Random Forest differ from plain bagging of trees?\",\n     \"A forest also picks a random subset of features at each split. This decorrelates the trees, so averaging them reduces variance more.\"),\n    (\"Bagging\", \"What is the OOB score?\",\n     \"Accuracy measured on each row using only trees that did not see that row in training - an almost free validation estimate (`oob_score=True`).\"),\n    (\"Bagging\", \"Does adding more trees to a Random Forest cause overfitting?\",\n     \"Generally no - accuracy plateaus. It only costs more time and memory. (Individual deep trees can still overfit.)\"),\n    (\"Voting\", \"Hard vs. soft voting?\",\n     \"Hard counts predicted labels; soft averages predicted probabilities. Soft can let one confident model outweigh two unsure ones, and needs `predict_proba`.\"),\n    (\"Boosting\", \"How does AdaBoost work?\",\n     \"Train a weak learner, increase the weights of the samples it misclassified, train the next learner on the re-weighted data, an
